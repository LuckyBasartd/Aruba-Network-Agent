# /etc/httpd/conf.d/aruba-switch-manager.conf
#
# Apache2 reverse proxy in front of the Aruba Switch Manager Flask app.
#
# Layout:
#   browser  ── HTTPS :443 ──>  Apache (this vhost)  ── HTTP :8080 ──>  Flask
#                                  │
#                                  └─ HSTS, TLS termination, X-Forwarded-* injection
#
# The Flask app listens on 127.0.0.1:8080 only — Apache is the public face.
#
# Required Apache modules (enabled by default on AlmaLinux 9 with mod_ssl):
#   ssl_module, proxy_module, proxy_http_module, headers_module, rewrite_module
#
# SELinux note (AlmaLinux 9):
#   Apache must be allowed to make outbound connections to the Flask backend:
#       sudo setsebool -P httpd_can_network_connect 1


# ------------------------------------------------------------------------
# Port 80 — redirect every request to HTTPS
# ------------------------------------------------------------------------
<VirtualHost *:80>
    # ServerName is set by install-apache.sh to the host's FQDN.
    # ServerAlias * makes this a catch-all so the vhost wins for any
    # name/IP a client might use — without this Apache falls through
    # to the stock /var/www/html "AlmaLinux test page".
    ServerName aruba-switch-manager
    ServerAlias *

    # Send everything to HTTPS, preserving path + query string.
    RewriteEngine On
    RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

    ErrorLog  /var/log/httpd/aruba-switch-manager_error.log
    CustomLog /var/log/httpd/aruba-switch-manager_access.log combined
</VirtualHost>


# ------------------------------------------------------------------------
# Port 443 — TLS termination + reverse proxy to the Flask backend
# ------------------------------------------------------------------------
<VirtualHost *:443>
    # See note above — ServerAlias * keeps Apache from falling through
    # to ssl.conf's _default_:443 vhost (which serves the test page).
    ServerName aruba-switch-manager
    ServerAlias *

    # ─── TLS ───────────────────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile      /etc/pki/tls/certs/aruba-switch-manager.crt
    SSLCertificateKeyFile   /etc/pki/tls/private/aruba-switch-manager.key

    # Modern Mozilla "intermediate" — drops SSLv3/TLSv1.0/1.1
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     on
    SSLSessionTickets       off

    # ─── Security headers ──────────────────────────────────────────────
    # HSTS — opt every browser into HTTPS for the next year. preload is
    # left off intentionally; only add it once the cert is from a public
    # CA (the self-signed cert flow this repo ships would lock browsers
    # out of recovery).
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "DENY"
    Header always set Referrer-Policy           "same-origin"

    # Content-Security-Policy — defense in depth against any XSS-class
    # bug that slips past the templates' Jinja autoescape. Allows the
    # two CDNs the dashboard already pulls from (jsdelivr for
    # Bootstrap + Bootstrap Icons). 'unsafe-inline' on style/script is
    # the trade-off for the inline <script> blocks the dashboard uses
    # to wire fetch() handlers; tightening that would require pulling
    # every inline block out into separate files and is left for a
    # future asset-pipeline pass.
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # Tell browsers / proxies not to cache pages that may contain
    # session-specific data. The Settings UI in particular flashes
    # one-time messages and one-time API tokens that should NEVER
    # land in a back-button cache.
    Header always set Cache-Control "no-store, max-age=0"
    Header always set Pragma "no-cache"

    # Permissions-Policy — disable browser features the agent has no
    # business using. Tightens the page even when an attacker controls
    # the document via XSS.
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), interest-cohort=()"

    # ─── Reverse proxy → Flask on localhost:8080 ───────────────────────
    ProxyRequests       Off
    ProxyPreserveHost   On

    # Pass real client info so Flask + ProxyFix can populate
    # request.remote_addr and url_for(_external=True, _scheme="https").
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # The login flow uses POST + form data — no special handling needed.
    # ProxyTimeout default is 60s which is plenty for our endpoints.
    ProxyPass        / http://127.0.0.1:8080/ retry=0
    ProxyPassReverse / http://127.0.0.1:8080/

    # ─── Logging ───────────────────────────────────────────────────────
    ErrorLog  /var/log/httpd/aruba-switch-manager_ssl_error.log
    CustomLog /var/log/httpd/aruba-switch-manager_ssl_access.log combined
</VirtualHost>
