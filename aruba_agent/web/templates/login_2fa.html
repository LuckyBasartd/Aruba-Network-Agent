<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Two-factor verification — Aruba Network Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#0d1117; min-height:100vh; display:flex; align-items:center; }
    .card { background:#161b22; border:1px solid #30363d; }
    .form-control { background:#0d1117; border-color:#30363d; color:#c9d1d9; }
    .form-control:focus { background:#0d1117; border-color:#58a6ff; color:#c9d1d9; box-shadow:0 0 0 0.2rem rgba(88,166,255,0.25); }
    .totp-input { font-size:1.5rem; letter-spacing:.5rem; text-align:center; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-lg">
        <div class="card-body p-4">
          <h4 class="card-title text-center mb-4">
            <i class="bi bi-shield-lock-fill me-2 text-primary"></i>
            Two-factor verification
          </h4>

          {% for err in errors %}
          <div class="alert alert-danger py-2 small mb-3">
            <i class="bi bi-x-circle me-1"></i>{{ err }}
          </div>
          {% endfor %}

          <form method="POST" action="{{ url_for('login_2fa_post') }}" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next_url }}">

            <div class="mb-3">
              <label class="form-label">6-digit code from your authenticator app</label>
              <input type="text" class="form-control totp-input" name="code"
                     inputmode="numeric" pattern="[0-9]*" maxlength="6"
                     autofocus autocomplete="one-time-code">
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
              <i class="bi bi-check2-circle me-1"></i>Verify
            </button>
          </form>

          <hr class="my-3">

          <p class="small text-muted mb-2">
            Lost your device? Use a one-time recovery code:
          </p>
          <form method="POST" action="{{ url_for('login_2fa_post') }}" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="input-group input-group-sm">
              <input type="text" class="form-control font-monospace" name="recovery"
                     placeholder="ABCD-EFGH" autocomplete="off">
              <button type="submit" class="btn btn-outline-secondary">Use code</button>
            </div>
            <p class="small text-muted mt-2 mb-0">
              Each recovery code works exactly once.
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
