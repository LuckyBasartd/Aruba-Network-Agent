<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Traps — Network Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{background:#0d1117;color:#c9d1d9;}
    .tr-card{background:#161b22;border:1px solid #30363d;border-radius:12px;overflow:hidden;}
    .tr-tbl{width:100%;margin:0;font-size:13px;}
    .tr-tbl th{background:#21262d;color:#8b949e;font-weight:600;padding:9px 14px;text-align:left;font-size:12px;white-space:nowrap;}
    .tr-tbl td{padding:9px 14px;border-top:1px solid #21262d;vertical-align:top;}
    .tr-tbl tr:hover td{background:#1b2028;}
    .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;}
    .sev{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;}
    .sev-critical{background:#8b1a1a;color:#ffd7d7;}
    .sev-warning{background:#7a5b00;color:#ffe9b0;}
    .sev-info{background:#30363d;color:#c9d1d9;}
    .muted{color:#8b949e;}
    select,input{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;border-radius:7px;padding:5px 9px;font-size:13px;}
  </style>
</head>
<body>
{% include "_topnav.html" with context %}
<div class="na-crumb"><a href="{{ url_for('dashboard') }}"><i class="bi bi-house-door"></i> Home</a><span class="sep">/</span>Traps</div>

<div class="container-fluid py-4 px-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h2 class="mb-0"><i class="bi bi-bell me-2 text-primary"></i>SNMP Traps</h2>
    <div class="d-flex gap-2 align-items-center">
      <input id="f-switch" placeholder="filter switch…" style="width:150px" oninput="load()">
      <select id="f-sev" onchange="load()">
        <option value="">all severities</option>
        <option value="critical">critical</option>
        <option value="warning">warning</option>
        <option value="info">info</option>
      </select>
      <button class="btn btn-outline-secondary btn-sm" onclick="load()"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
  </div>

  <div id="box" class="tr-card"><div class="muted p-3">Loading…</div></div>
</div>

<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtTs(t){ if(!t) return ''; const d=new Date(t); return isNaN(d)?esc(t):d.toLocaleString(); }
async function load(){
  const box=document.getElementById('box');
  const sw=document.getElementById('f-switch').value.trim();
  const sev=document.getElementById('f-sev').value;
  const qs=new URLSearchParams(); if(sw)qs.set('switch',sw); if(sev)qs.set('severity',sev);
  try{
    const d=await (await fetch('/api/traps?'+qs.toString())).json();
    if(!d.enabled){ box.innerHTML='<div class="muted p-3">Trap receiver is disabled ([traps] enabled=false).</div>'; return; }
    const t=d.traps||[];
    if(!t.length){ box.innerHTML='<div class="muted p-3">No traps received yet.</div>'; return; }
    box.innerHTML=`<table class="tr-tbl"><thead><tr>
      <th>Time</th><th>Severity</th><th>Trap</th><th>Switch</th><th>Detail</th></tr></thead><tbody>
      ${t.map(r=>`<tr>
        <td class="muted" style="white-space:nowrap">${fmtTs(r.ts)}</td>
        <td><span class="sev sev-${esc(r.severity||'info')}">${esc(r.severity||'info')}</span></td>
        <td>${esc(r.name||'')}<div class="muted mono">${esc(r.category||'')}</div></td>
        <td><a href="/switch/${encodeURIComponent(r.switch||'')}" class="text-decoration-none">${esc(r.switch||'')}</a>
            <div class="muted mono">${esc(r.source_ip||'')}</div></td>
        <td class="mono" style="max-width:520px">${esc((r.message||'').split('\\n').slice(3).join(' · ')||r.oid||'')}</td>
      </tr>`).join('')}</tbody></table>`;
  }catch(e){ box.innerHTML='<div class="text-danger p-3">Failed to load traps.</div>'; }
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
