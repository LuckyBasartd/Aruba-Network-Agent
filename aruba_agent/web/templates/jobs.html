<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Jobs — Network Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{background:#0d1117;color:#c9d1d9;}
    .jobs-card{background:#161b22;border:1px solid #30363d;border-radius:12px;overflow:hidden;}
    table.jobs{width:100%;margin:0;font-size:14px;}
    table.jobs th{background:#21262d;color:#8b949e;font-weight:500;padding:10px 14px;text-align:left;font-size:13px;}
    table.jobs td{padding:11px 14px;border-top:1px solid #21262d;vertical-align:middle;}
    .j-name{font-weight:600;color:#e6edf3;}
    .j-type{color:#8b949e;font-size:12px;}
    .pill{font-size:11px;padding:3px 9px;border-radius:20px;}
    .pill-on{background:#238636;color:#fff;}
    .pill-off{background:#6e7681;color:#fff;}
    .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#8b949e;}
  </style>
</head>
<body>
{% include "_topnav.html" with context %}
<div class="na-crumb"><a href="{{ url_for('dashboard') }}"><i class="bi bi-house-door"></i> Home</a><span class="sep">/</span>Jobs</div>

<div class="container-fluid py-4 px-4">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h2 class="mb-0"><i class="bi bi-list-check me-2 text-primary"></i>Jobs</h2>
    <button class="btn btn-outline-secondary btn-sm" onclick="loadJobs()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
  </div>

  <div class="jobs-card">
    <table class="jobs">
      <thead>
        <tr>
          <th>Job</th><th>Schedule</th><th>Status</th><th>Last run</th>
          <th>Next run</th><th>Last result</th><th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody id="jobs-body">
        <tr><td colspan="7" class="text-center text-muted py-3">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <p class="text-muted small mt-3">
    <i class="bi bi-info-circle me-1"></i>
    Run any job on demand here. Use <strong>Edit</strong> to change its schedule or enable/disable it
    (takes effect after the next agent restart). Full inline scheduling and run history are coming.
  </p>
</div>

<script>
  const CSRF=(document.querySelector('meta[name="csrf-token"]')||{}).content||'';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=iso=>iso?new Date(iso).toLocaleString():'—';

  function toast(msg){
    const el=document.createElement('div');
    el.className='position-fixed bottom-0 end-0 m-3 alert alert-info alert-dismissible fade show';
    el.style.zIndex=9999;
    el.innerHTML=esc(msg)+'<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
    document.body.appendChild(el); setTimeout(()=>el.remove(),4000);
  }

  async function loadJobs(){
    try{
      const {jobs}=await (await fetch('/api/jobs')).json();
      const body=document.getElementById('jobs-body');
      if(!jobs||!jobs.length){body.innerHTML='<tr><td colspan="7" class="text-center text-muted py-3">No scheduled jobs configured.</td></tr>';return;}
      body.innerHTML=jobs.map(j=>`
        <tr>
          <td><div class="j-name">${esc(j.name)}</div><div class="j-type">${esc(j.type)}</div></td>
          <td class="mono">${esc(j.schedule)}</td>
          <td>${j.enabled?'<span class="pill pill-on">Enabled</span>':'<span class="pill pill-off">Disabled</span>'}</td>
          <td class="mono">${fmt(j.last_run)}</td>
          <td class="mono">${j.enabled?fmt(j.next_run):'—'}</td>
          <td>${esc(j.last_status)}</td>
          <td class="text-end" style="white-space:nowrap;">
            <button class="btn btn-outline-success btn-sm py-0 me-1" onclick="runJob('${esc(j.trigger)}','${esc(j.name)}',this)"><i class="bi bi-play-fill"></i> Run now</button>
            <a class="btn btn-outline-secondary btn-sm py-0" href="${esc(j.edit)}"><i class="bi bi-pencil"></i> Edit</a>
          </td>
        </tr>`).join('');
    }catch(e){document.getElementById('jobs-body').innerHTML='<tr><td colspan="7" class="text-danger text-center py-3">Failed to load jobs.</td></tr>';}
  }

  async function runJob(url,name,btn){
    btn.disabled=true; const o=btn.innerHTML; btn.innerHTML='<span class="spinner-border spinner-border-sm"></span>';
    try{
      const r=await fetch(url,{method:'POST',headers:{'X-CSRFToken':CSRF}});
      if(r.ok) toast(`${name} started — check logs for progress.`);
      else{const j=await r.json().catch(()=>({})); toast(`${name} failed: ${j.error||('HTTP '+r.status)}`);}
    }catch(e){toast(`${name} error: ${e.message}`);}
    finally{setTimeout(()=>{btn.disabled=false;btn.innerHTML=o;loadJobs();},1500);}
  }

  loadJobs(); setInterval(loadJobs, 30000);
</script>
</body>
</html>
