{# Shared modern top navigation. Include at the top of <body>.
   Context: active_nav ('dashboard'|'jobs'|'settings'), current_user. #}
<style>
  .na-topnav{display:flex;align-items:center;gap:22px;background:#161b22;
    border-bottom:1px solid #30363d;padding:10px 20px;position:sticky;top:0;z-index:1030;}
  .na-brand{display:flex;align-items:center;gap:8px;font-weight:600;color:#e6edf3;
    text-decoration:none;font-size:15px;letter-spacing:.01em;}
  .na-brand .bi{color:#58a6ff;font-size:19px;}
  .na-tabs{display:flex;gap:4px;}
  .na-tabs a{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:7px;
    color:#8b949e;text-decoration:none;font-size:14px;transition:background .15s,color .15s;}
  .na-tabs a:hover{color:#e6edf3;background:#21262d;}
  .na-tabs a.active{color:#58a6ff;background:rgba(88,166,255,.12);}
  .na-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .na-user{color:#8b949e;font-size:13px;display:flex;align-items:center;gap:6px;}
  .na-help{color:#8b949e;text-decoration:none;font-size:15px;}
  .na-help:hover{color:#58a6ff;}
  .na-logout{color:#8b949e;text-decoration:none;font-size:15px;}
  .na-logout:hover{color:#f85149;}
  .na-search{position:relative;}
  .na-search input{background:#0d1117;border:1px solid #30363d;border-radius:7px;
    color:#c9d1d9;font-size:13px;padding:5px 10px 5px 28px;width:170px;transition:width .15s,border-color .15s;}
  .na-search input:focus{outline:none;border-color:#58a6ff;width:210px;}
  .na-search .bi{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#6e7681;font-size:13px;pointer-events:none;}
  .na-crumb{font-size:13px;color:#6e7681;padding:14px 20px 0;}
  .na-crumb a{color:#8b949e;text-decoration:none;}
  .na-crumb a:hover{color:#58a6ff;}
  .na-crumb .sep{margin:0 7px;opacity:.6;}
</style>
<nav class="na-topnav">
  <a class="na-brand" href="{{ url_for('dashboard') }}"><i class="bi bi-router"></i>Network Agent</a>
  <div class="na-tabs">
    <a href="{{ url_for('dashboard') }}"     class="{{ 'active' if active_nav == 'dashboard' }}"><i class="bi bi-speedometer2"></i>Dashboard</a>
    <a href="{{ url_for('jobs_page') }}"      class="{{ 'active' if active_nav == 'jobs' }}"><i class="bi bi-list-check"></i>Jobs</a>
    <a href="{{ url_for('settings_page') }}"  class="{{ 'active' if active_nav == 'settings' }}"><i class="bi bi-gear"></i>Settings</a>
  </div>
  <div class="na-right">
    {% if current_user %}
    <form class="na-search" action="{{ url_for('mac_finder') }}" method="get" role="search">
      <i class="bi bi-search"></i>
      <input type="search" name="q" placeholder="Find MAC / device…" autocomplete="off"
             title="Search the MAC forwarding table" value="{{ request.args.get('q','') if request.endpoint=='mac_finder' else '' }}">
    </form>
    <a class="na-help" href="{{ url_for('help_page') }}" title="Help &amp; troubleshooting"><i class="bi bi-question-circle"></i></a>
    <span class="na-user"><i class="bi bi-person-circle"></i>{{ current_user }}{% if auth_method %} <span style="opacity:.7">({{ auth_method }})</span>{% endif %}</span>
    <a class="na-logout" href="{{ url_for('logout') }}" title="Sign out"><i class="bi bi-box-arrow-right"></i></a>
    {% endif %}
  </div>
</nav>
