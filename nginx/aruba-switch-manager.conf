# /etc/nginx/conf.d/aruba-switch-manager.conf
#
# nginx reverse proxy in front of the Aruba Switch Manager Flask app.
# Drop-in alternative to apache/aruba-switch-manager.conf for shops that
# standardise on nginx.
#
# Layout:
#   browser  ── HTTPS :443 ──>  nginx (this vhost)  ── HTTP :8080 ──>  Flask
#                                  │
#                                  └─ TLS termination, security headers,
#                                     X-Forwarded-* injection
#
# The Flask app listens on 127.0.0.1:8080 only — nginx is the public face.
#
# Required nginx modules: http_ssl_module, http_realip_module (both default
# in the upstream `nginx` RPM on AlmaLinux 10).
#
# SELinux note (AlmaLinux 10):
#   nginx must be allowed to make outbound connections to the Flask backend:
#       sudo setsebool -P httpd_can_network_connect 1
#   (the boolean is named httpd_can_network_connect even when the daemon
#   is nginx — it controls the same SELinux type.)
#
# TLS:
#   This file assumes you handle TLS externally and have a cert + key
#   already in place. The paths below are stock self-signed locations
#   that match scripts/generate-self-signed-cert.sh; change them if your
#   PKI puts certs elsewhere.

# ─── Port 80 — redirect every request to HTTPS ───────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Send everything to HTTPS, preserving path + query string.
    return 301 https://$host$request_uri;

    access_log /var/log/nginx/aruba-switch-manager_access.log;
    error_log  /var/log/nginx/aruba-switch-manager_error.log;
}

# ─── Port 443 — TLS termination + reverse proxy ──────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    # ─── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/pki/tls/certs/aruba-switch-manager.crt;
    ssl_certificate_key /etc/pki/tls/private/aruba-switch-manager.key;

    # Modern Mozilla "intermediate" — drops SSLv3 / TLS 1.0 / 1.1.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # ─── Security headers ────────────────────────────────────────────────────
    # Mirrors apache/aruba-switch-manager.conf — keep them in sync if you
    # change either file. ``always`` semantics: send on every response,
    # including 4xx / 5xx from the upstream Flask app.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "same-origin"                          always;

    # CSP — defense in depth against any XSS-class bug. Same trade-off as
    # the Apache vhost: 'unsafe-inline' on style/script lets the existing
    # inline <script> blocks keep working. Tightening would require
    # extracting them into static assets.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # No-store keeps Settings → API Tokens "shown once" tokens and other
    # session-flash content out of back-button caches.
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma        "no-cache"             always;

    # Permissions-Policy — disable browser features the agent doesn't use.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), interest-cohort=()" always;

    # ─── Logging ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/aruba-switch-manager_ssl_access.log;
    error_log  /var/log/nginx/aruba-switch-manager_ssl_error.log;

    # Generous body size — the firmware upload page can send multi-MB
    # form parts during a manual upload.
    client_max_body_size 64m;

    # ─── Reverse proxy → Flask on localhost:8080 ─────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;

        # Preserve the original Host so url_for() in Flask matches the
        # name the user actually hit.
        proxy_set_header   Host              $host;

        # Real-client info for Flask's ProxyFix middleware.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # Sensible upstream timeouts. The agent never serves long-poll;
        # 60s is plenty for the slowest endpoints (manual scan trigger
        # returns immediately and the work runs in a background thread).
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Don't buffer responses — the dashboard wants /api/state's JSON
        # to land as soon as Flask emits it.
        proxy_buffering       off;

        # http/1.1 so keep-alives + chunked transfer work cleanly.
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
    }
}
