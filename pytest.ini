[pytest]
# Tests live in tests/ and import the aruba_agent package directly from
# the repo root (no install needed). Adding the repo root to sys.path
# via conftest.py keeps the test run self-contained.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Quiet pytest's default output unless something fails. -v / -vv at the
# CLI overrides this.
addopts = -q --tb=short

# Warnings most folks don't need to see during a green test run.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
